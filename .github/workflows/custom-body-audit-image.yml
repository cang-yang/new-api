name: Publish personal request lab image

on:
  workflow_dispatch:
  push:
    branches:
      - feature/personal-request-lab
    paths:
      - '.github/workflows/custom-body-audit-image.yml'
      - 'Dockerfile'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
      - 'relaykit/**'
      - 'web/**'

concurrency:
  group: personal-request-lab-image
  # Interrupting a rollout can leave Compose half-updated. Queue pushes.
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify custom audit backend
        shell: bash
        run: |
          go test ./controller -run 'BodyAudit|ChannelTestStoresBodyAudit|AuditTrace|RequestLab|SimulateParamOverride|ShouldRetry|AuditReplay|FingerprintChannelError|ErrorIncident' -count=1
          go test ./model -run 'BodyAudit|AuditTrace|AuditAttempt|AuditConfig|RequestLab|AuditReplay|ErrorIncident' -count=1
          go test ./service -run 'BodyAudit|AuditTrace|AuditAttempt|AuditConfig|RequestLab|AppendStreamStatus|ValidateRequestSpendLimit|PreConsumeBillingRejects|AttemptConfigSnapshot|ResponseTextFilter|PreviewTextRegex|TextRegex|PresetRegex|SendTextRegex' -count=1
          go test ./relay/common -run 'TestApplyParamOverride|TestCompileParamOverride|TestSimulateParamOverride|TestStreamStatus' -count=1
          go test ./relay/helper -run 'TestStreamScannerHandler' -count=1
          go test ./relay/channel/openai -run 'Empty|OaiStreamHandler|OaiResponsesStreamHandler' -count=1
          go test ./relay/channel/claude -run 'ProtocolOutcome|Empty|Stream' -count=1
          go test ./relay/channel/gemini -run 'ProtocolOutcome|Empty|Stream' -count=1
          go test ./router -run 'TestParamOverrideSimulator|TestAuditReplay|TestErrorIncident' -count=1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Test frontend
        working-directory: web
        run: >-
          bun run test
          src/features/usage-logs/components/__tests__/body-audit-result.test.tsx
          src/features/usage-logs/components/__tests__/body-audit-section-layout.test.tsx
          src/features/usage-logs/components/__tests__/audit-replay-dialog.test.tsx
          src/features/usage-logs/lib/__tests__/body-audit-response.test.ts
          src/features/usage-logs/lib/__tests__/json-diff.test.ts
          src/features/usage-logs/lib/__tests__/error-incident.test.ts
          src/features/channels/lib/__tests__/param-override-simulator.test.ts
          src/features/channels/components/dialogs/__tests__/param-override-simulator-dialog.test.tsx
          src/features/channels/components/dialogs/__tests__/param-override-editor-simulator-entry.test.tsx
          src/features/channels/components/__tests__/sillytavern-preset-editor.test.tsx
          src/features/channels/components/__tests__/channel-configuration.test.tsx
          src/features/channels/components/__tests__/regex-rules-editor.test.tsx
          src/features/channels/components/__tests__/regex-playground.test.tsx
          src/features/channels/lib/__tests__/regex-rules.test.ts
          src/features/channels/lib/__tests__/preset-editing.test.ts
          src/features/channels/lib/__tests__/sillytavern-configuration.test.ts

      - name: Typecheck frontend
        working-directory: web
        run: bun run typecheck

      - name: Build frontend
        working-directory: web
        run: bun run build

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/new-api"
          VERSION="personal-lab-${SHORT_SHA}"
          echo "${VERSION}" > VERSION
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:personal-lab
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write deployment summary
        run: |
          {
            echo '### Personal request lab image'
            echo '```text'
            echo '${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}'
            echo '${{ steps.build.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy tested image to VPS
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: personal-lab-vps
    permissions:
      contents: read
    steps:
      - name: Deploy exact image digest
        env:
          DEPLOY_KEY: ${{ secrets.VPS_DEPLOY_SSH_KEY }}
          VPS_HOST_KEY: ${{ vars.VPS_SSH_HOST_KEY }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ -n "$DEPLOY_KEY" && -n "$VPS_HOST_KEY" ]]
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh -p 22222 -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes -o ConnectTimeout=15 \
            root@23.238.7.190 "deploy $IMAGE_DIGEST"
