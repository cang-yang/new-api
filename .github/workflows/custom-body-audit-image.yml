name: Publish custom body-audit image

on:
  workflow_dispatch:
  push:
    branches:
      - feature/body-audit-ui
    paths:
      - '.github/workflows/custom-body-audit-image.yml'
      - 'Dockerfile'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
      - 'relaykit/**'
      - 'web/**'

concurrency:
  group: custom-body-audit-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify body audit service
        shell: bash
        run: |
          test -z "$(gofmt -l service/body_audit.go service/body_audit_test.go)"
          go test ./service -run 'TestBodyAudit' -count=1

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/new-api"
          VERSION="body-audit-${SHORT_SHA}"
          echo "${VERSION}" > VERSION
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:body-audit
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write deployment summary
        run: |
          {
            echo '### Custom New API image'
            echo '```text'
            echo '${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}'
            echo '${{ steps.build.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
