name: Publish personal request lab image

on:
  workflow_dispatch:
  push:
    branches:
      - feature/personal-request-lab
    paths:
      - '.github/workflows/custom-body-audit-image.yml'
      - 'Dockerfile'
      - 'VERSION'
      - 'go.mod'
      - 'go.sum'
      - '**/*.go'
      - 'relaykit/**'
      - 'web/**'

concurrency:
  group: personal-request-lab-image
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify custom audit backend
        shell: bash
        run: |
          go test ./controller -run 'BodyAudit|ChannelTestStoresBodyAudit|AuditTrace|RequestLab|SimulateParamOverride|ShouldRetry' -count=1
          go test ./model -run 'BodyAudit|AuditTrace|AuditAttempt|AuditConfig|RequestLab' -count=1
          go test ./service -run 'BodyAudit|AuditTrace|AuditAttempt|AuditConfig|RequestLab|AppendStreamStatus' -count=1
          go test ./relay/common -run 'TestApplyParamOverride|TestCompileParamOverride|TestSimulateParamOverride|TestStreamStatus' -count=1
          go test ./relay/helper -run 'TestStreamScannerHandler' -count=1
          go test ./relay/channel/openai -run 'Empty|OaiStreamHandler|OaiResponsesStreamHandler' -count=1
          go test ./router -run 'TestParamOverrideSimulator' -count=1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.3.14'

      - name: Install frontend dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Test frontend
        working-directory: web
        run: >-
          bun run test
          src/features/usage-logs/components/__tests__/body-audit-result.test.tsx
          src/features/usage-logs/lib/__tests__/body-audit-response.test.ts
          src/features/usage-logs/lib/__tests__/json-diff.test.ts

      - name: Typecheck frontend
        working-directory: web
        run: bun run typecheck

      - name: Build frontend
        working-directory: web
        run: bun run build

      - name: Prepare image metadata
        id: meta
        shell: bash
        run: |
          SHORT_SHA="${GITHUB_SHA::12}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/new-api"
          VERSION="personal-lab-${SHORT_SHA}"
          echo "${VERSION}" > VERSION
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c99871dec2022cc055c062a10cc1a1310835ceb4 # v4.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:personal-lab
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Write deployment summary
        run: |
          {
            echo '### Personal request lab image'
            echo '```text'
            echo '${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.version }}'
            echo '${{ steps.build.outputs.digest }}'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
